name: iOS CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "claude/**"
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FocusFlow.xcodeproj \
            -scheme FocusFlow

      - name: Select simulator destination
        id: simulator
        run: |
          SIMULATOR_NAME=$(xcrun simctl list devices available | grep -Eo 'iPhone [^()]+' | head -n 1 | xargs)
          if [ -z "$SIMULATOR_NAME" ]; then
            echo "No available iPhone simulator found."
            exit 1
          fi
          echo "destination=platform=iOS Simulator,name=$SIMULATOR_NAME" >> "$GITHUB_OUTPUT"
          echo "Using destination: platform=iOS Simulator,name=$SIMULATOR_NAME"

      - name: Build app
        run: |
          xcodebuild -project FocusFlow.xcodeproj \
            -scheme FocusFlow \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The FocusFlowTests scheme owns the unit test target. This step must fail
      # the job when tests fail *or* when the scheme loses its test action - a
      # silently skipped suite is how this repo used to report green.
      - name: Run tests
        run: |
          xcodebuild -project FocusFlow.xcodeproj \
            -scheme FocusFlowTests \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
