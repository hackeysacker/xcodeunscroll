name: iOS CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        # FocusFlow.xcodeproj is generated from project.yml by XcodeGen.
        # Regenerating in CI guarantees the project under test matches the
        # source of truth, and catches any drift between the two.
        #
        # The comparison normalises list ordering: XcodeGen emits target lists
        # in a non-deterministic order and different XcodeGen versions order
        # them differently. Ordering has no effect on the build, so a raw byte
        # diff produces false failures.
        run: python3 scripts/check_project_sync.py

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FocusFlow.xcodeproj \
            -scheme FocusFlow

      - name: Select simulator destination
        id: simulator
        run: |
          SIMULATOR_NAME=$(xcrun simctl list devices available | grep -Eo 'iPhone [^()]+' | head -n 1 | xargs)
          if [ -z "$SIMULATOR_NAME" ]; then
            echo "No available iPhone simulator found."
            exit 1
          fi
          echo "destination=platform=iOS Simulator,name=$SIMULATOR_NAME" >> "$GITHUB_OUTPUT"
          echo "Using destination: platform=iOS Simulator,name=$SIMULATOR_NAME"

      - name: Build app
        run: |
          xcodebuild -project FocusFlow.xcodeproj \
            -scheme FocusFlow \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run tests
        run: |
          xcodebuild -project FocusFlow.xcodeproj \
            -scheme FocusFlow \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
